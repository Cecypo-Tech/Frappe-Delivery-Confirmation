<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570">

<defs>
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1" fill="#e2e8f0" opacity="0.8"/>
  </pattern>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
  </marker>
  <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
  </marker>
  <marker id="arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
  </marker>
</defs>

<!-- ═══ BACKGROUND ═══ -->
<rect width="800" height="570" fill="#f1f5f9"/>
<rect width="800" height="570" fill="url(#dots)"/>

<!-- ═══ HEADER BAR ═══ -->
<rect width="800" height="68" fill="#0f172a"/>
<rect y="65" width="800" height="3" fill="#6366f1"/>

<!-- App icon with mini QR -->
<rect x="20" y="14" width="40" height="40" rx="9" fill="#6366f1"/>
<rect x="26" y="20" width="6" height="6" rx="1.5" fill="white"/>
<rect x="34" y="20" width="6" height="6" rx="1.5" fill="white"/>
<rect x="26" y="28" width="6" height="6" rx="1.5" fill="white"/>
<rect x="34" y="28" width="3" height="3" rx="0.8" fill="white"/>
<rect x="39" y="28" width="3" height="3" rx="0.8" fill="white"/>
<rect x="34" y="33" width="6" height="6" rx="1.5" fill="white"/>
<rect x="26" y="35" width="2.5" height="2.5" rx="0.5" fill="white"/>

<text x="68" y="37" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="white" letter-spacing="-0.4">Delivery Confirmation</text>
<text x="68" y="56" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">How it works · Scan a QR code to confirm delivery or detect duplicates</text>

<!-- ═══════════════════════════════════════ -->
<!-- TOP ROW: THREE STEP CARDS              -->
<!-- ═══════════════════════════════════════ -->

<!-- ── STEP 1: Document with QR ── -->
<rect x="30" y="92" width="195" height="136" rx="12" fill="#00000011"/>
<rect x="26" y="88" width="195" height="136" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
<!-- Badge -->
<circle cx="46" cy="108" r="13" fill="#6366f1"/>
<text x="46" y="113" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="white">1</text>

<!-- Paper icon with QR -->
<rect x="98" y="100" width="50" height="62" rx="3" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<!-- Folded corner -->
<path d="M133 100 L148 100 L148 115 L133 115 Z" fill="#e2e8f0"/>
<path d="M133 100 L133 115 L148 115" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<!-- Text lines -->
<line x1="106" y1="126" x2="140" y2="126" stroke="#e2e8f0" stroke-width="1.5"/>
<line x1="106" y1="133" x2="134" y2="133" stroke="#e2e8f0" stroke-width="1.5"/>
<line x1="106" y1="140" x2="138" y2="140" stroke="#e2e8f0" stroke-width="1.5"/>
<!-- QR code mini on paper -->
<rect x="106" y="148" width="15" height="12" rx="1" fill="none" stroke="#6366f1" stroke-width="0.8"/>
<rect x="108" y="150" width="3.5" height="3.5" fill="#6366f1"/>
<rect x="114" y="150" width="3.5" height="3.5" fill="#6366f1"/>
<rect x="108" y="155" width="3.5" height="3.5" fill="#6366f1"/>
<rect x="114" y="155" width="2" height="2" fill="#6366f1"/>
<rect x="118" y="152" width="2" height="2" fill="#6366f1"/>

<!-- Labels -->
<text x="123" y="178" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Sales Document</text>
<text x="123" y="196" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748b">Invoice or Delivery Note</text>
<text x="123" y="212" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748b">printed with a QR code</text>

<!-- ── ARROW 1 ── -->
<line x1="225" y1="156" x2="262" y2="156" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

<!-- ── STEP 2: Scan with Phone ── -->
<rect x="270" y="92" width="220" height="136" rx="12" fill="#00000011"/>
<rect x="266" y="88" width="220" height="136" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
<circle cx="286" cy="108" r="13" fill="#6366f1"/>
<text x="286" y="113" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="white">2</text>

<!-- Phone shape -->
<rect x="354" y="99" width="42" height="68" rx="7" fill="#1e293b"/>
<!-- Screen -->
<rect x="358" y="107" width="34" height="46" rx="2" fill="#f8fafc"/>
<!-- Camera dot -->
<circle cx="375" cy="103.5" r="1.5" fill="#475569"/>
<!-- Scan lines -->
<line x1="360" y1="124" x2="390" y2="124" stroke="#6366f1" stroke-width="1.5" opacity="0.7"/>
<line x1="360" y1="130" x2="390" y2="130" stroke="#6366f1" stroke-width="1.5" opacity="0.35"/>
<line x1="360" y1="136" x2="390" y2="136" stroke="#6366f1" stroke-width="1.5" opacity="0.7"/>
<!-- Corner brackets -->
<path d="M361 110 L361 116 M361 110 L367 110" stroke="#6366f1" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M389 110 L389 116 M389 110 L383 110" stroke="#6366f1" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M361 150 L361 144 M361 150 L367 150" stroke="#6366f1" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M389 150 L389 144 M389 150 L383 150" stroke="#6366f1" stroke-width="2" fill="none" stroke-linecap="round"/>
<!-- Home button -->
<circle cx="375" cy="162" r="3" fill="#334155"/>

<text x="376" y="185" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Scan the QR Code</text>
<text x="376" y="203" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748b">Driver or recipient scans</text>
<text x="376" y="218" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748b">with any mobile device</text>

<!-- ── ARROW 2 ── -->
<line x1="490" y1="156" x2="524" y2="156" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

<!-- ── STEP 3: System Database Check ── -->
<rect x="532" y="92" width="242" height="136" rx="12" fill="#00000011"/>
<rect x="528" y="88" width="242" height="136" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<circle cx="548" cy="108" r="13" fill="#6366f1"/>
<text x="548" y="113" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="white">3</text>

<!-- Database cylinder -->
<ellipse cx="649" cy="115" rx="27" ry="9" fill="#ddd6fe" stroke="#6366f1" stroke-width="1.5"/>
<rect x="622" y="115" width="54" height="30" fill="#ede9fe"/>
<line x1="622" y1="115" x2="622" y2="145" stroke="#6366f1" stroke-width="1.5"/>
<line x1="676" y1="115" x2="676" y2="145" stroke="#6366f1" stroke-width="1.5"/>
<ellipse cx="649" cy="145" rx="27" ry="9" fill="#ddd6fe" stroke="#6366f1" stroke-width="1.5"/>
<text x="649" y="137" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#6366f1">?</text>

<text x="649" y="183" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4c1d95">System Checks Database</text>
<text x="649" y="201" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b21b6">Has this document been</text>
<text x="649" y="217" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b21b6">scanned before?</text>

<!-- ═══════════════════════════════════════ -->
<!-- T-SPLIT CONNECTOR                      -->
<!-- ═══════════════════════════════════════ -->

<!-- Vertical down from box 3 bottom -->
<line x1="649" y1="224" x2="649" y2="268" stroke="#94a3b8" stroke-width="2"/>
<!-- Horizontal bar -->
<line x1="210" y1="268" x2="649" y2="268" stroke="#94a3b8" stroke-width="2"/>
<!-- Arrow to green outcome -->
<line x1="210" y1="268" x2="210" y2="302" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-g)"/>
<!-- Arrow to red outcome -->
<line x1="649" y1="268" x2="649" y2="302" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-r)"/>

<!-- Branch labels -->
<rect x="118" y="257" width="184" height="22" rx="11" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
<text x="210" y="272.5" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#16a34a">NO — not scanned before</text>

<rect x="555" y="257" width="188" height="22" rx="11" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
<text x="649" y="272.5" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#dc2626">YES — already scanned</text>

<!-- ═══════════════════════════════════════ -->
<!-- OUTCOME A: GREEN — CONFIRMED           -->
<!-- ═══════════════════════════════════════ -->

<!-- Card shadow -->
<rect x="16" y="306" width="382" height="188" rx="14" fill="#00000013"/>
<!-- Card -->
<rect x="12" y="302" width="382" height="188" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<!-- Green header -->
<rect x="12" y="302" width="382" height="56" rx="14" fill="#16a34a"/>
<rect x="12" y="342" width="382" height="16" fill="#16a34a"/>

<!-- Check icon -->
<circle cx="50" cy="330" r="17" fill="rgba(255,255,255,0.18)"/>
<circle cx="50" cy="330" r="12" fill="white"/>
<path d="M43 330 L48 336 L58 323" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Header text -->
<text x="203" y="323" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="white">Delivery Confirmed!</text>
<text x="203" y="343" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.88)">First scan — goods received successfully</text>

<!-- Body -->
<text x="203" y="383" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#166534">✓  Scan recorded with date and time</text>
<text x="203" y="404" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#166534">✓  Document marked as delivered</text>
<text x="203" y="425" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#166534">✓  Scanned by user is logged</text>

<!-- Divider -->
<line x1="30" y1="443" x2="376" y2="443" stroke="#86efac" stroke-width="1"/>

<text x="203" y="472" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#4ade80" font-style="italic">Screen turns green · No further action needed</text>

<!-- ═══════════════════════════════════════ -->
<!-- OUTCOME B: RED — DUPLICATE ALERT       -->
<!-- ═══════════════════════════════════════ -->

<!-- Card shadow -->
<rect x="456" y="306" width="332" height="188" rx="14" fill="#00000013"/>
<!-- Card -->
<rect x="452" y="302" width="332" height="188" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
<!-- Red header -->
<rect x="452" y="302" width="332" height="56" rx="14" fill="#dc2626"/>
<rect x="452" y="342" width="332" height="16" fill="#dc2626"/>

<!-- Warning icon -->
<circle cx="490" cy="330" r="17" fill="rgba(255,255,255,0.18)"/>
<circle cx="490" cy="330" r="12" fill="white"/>
<path d="M490 320 L501 338 L479 338 Z" fill="#dc2626"/>
<text x="490" y="336" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="white">!</text>

<!-- Header text -->
<text x="618" y="323" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="white">Duplicate Alert!</text>
<text x="618" y="343" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.88)">This document was already scanned</text>

<!-- Body -->
<text x="618" y="383" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#991b1b">⚠  Screen turns red — stop delivery</text>
<text x="618" y="404" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#991b1b">⚠  Previous scan date is displayed</text>
<text x="618" y="425" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#991b1b">⚠  Admin notified by email instantly</text>

<!-- Divider -->
<line x1="470" y1="443" x2="766" y2="443" stroke="#fca5a5" stroke-width="1"/>

<text x="618" y="472" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#f87171" font-style="italic">Possible double delivery — verify before handing over!</text>

<!-- ═══ FOOTER ═══ -->
<rect y="508" width="800" height="1.5" fill="#e2e8f0"/>
<text x="400" y="530" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#94a3b8">Cecypo Delivery Confirmation · Powered by Frappe / ERPNext</text>
<text x="400" y="550" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#94a3b8">Scan once = confirm delivery · Scan again = alert admins and stop</text>

</svg>
